name: Szukaj iPhone

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  szukaj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Uruchom skrypt
        env:
          RUN_ONCE: "1"
          NTFY_TEMAT: ${{ secrets.NTFY_TEMAT }}
        run: python iphone_szukaj.py

      - name: Zapisz widziane oferty
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add widziane.json
          git diff --staged --quiet || (git commit -m "aktualizacja widzianych ofert" && git push)
          
